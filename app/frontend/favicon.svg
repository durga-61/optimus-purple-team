  <path d="M29 41 L32 38 L35 41" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M23 29 L26 28 L25 32" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M41 35 L38 36 L39 32" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M25 32 L26 36 L23 35" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M39 32 L38 28 L41 29" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center Sensor Node -->
  <circle cx="32" cy="31" r="3" fill="#38bdf8"/>
  <circle cx="32" cy="31" r="1.5" fill="#ffffff"/>
  <!-- Node dots at extremities -->
  <circle cx="32" cy="18" r="1.5" fill="#60a5fa"/>
  <circle cx="32" cy="44" r="1.5" fill="#60a5fa"/>
  <circle cx="21" cy="25" r="1.5" fill="#60a5fa"/>
  <circle cx="43" cy="37" r="1.5" fill="#60a5fa"/>
  <circle cx="21" cy="37" r="1.5" fill="#60a5fa"/>
  <circle cx="43" cy="25" r="1.5" fill="#60a5fa"/>
</svg>
